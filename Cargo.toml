[package]
name = "sighthound"
version = "0.1.1"
edition = "2021"
authors = ["Corgea Team"]
description = "A blazing fast vulnerability scanner for source code using tree-sitter"
repository = "https://github.com/corgea/greppy_prototype"

[[bin]]
name = "sighthound"
path = "src/main.rs"

[features]
default = ["python", "java", "javascript", "tsx", "html", "django"]
python = ["tree-sitter-python"]
java = ["tree-sitter-java"]
javascript = ["tree-sitter-javascript"]
tsx = ["tree-sitter-typescript"]
typescript = ["tree-sitter-typescript"]
go = ["tree-sitter-go"]
ruby = ["tree-sitter-ruby"]
csharp = ["tree-sitter-c-sharp"]
html = ["tree-sitter-html"]
django = ["tree-sitter-html"]  # Reuse HTML parser for Django templates

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
regex = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
walkdir = "2.4"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.18"
rayon = "1.8"
indicatif = "0.17"
glob = "0.3"
crossbeam = "0.8"
num_cpus = "1.16"
syntect = "5.1"
memmap2 = "0.9"
log = "0.4"
env_logger = "0.10"
ignore = "0.4"
lazy_static = "1.4"
dbg_breakpoint="0.1.1"
[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = "thin"

[[test]]
name = "unit_tests"
path = "tests/unit/main.rs"

[[test]]
name = "integration_tests"
path = "tests/integration/main.rs"

[[test]]
name = "end_to_end_tests"
path = "tests/end_to_end/main.rs"

