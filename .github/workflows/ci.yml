name: CI

on:
  push:
    branches: [main]
  pull_request:

# Validation jobs do not need to modify repository contents. Keep the token
# read-only even if the repository default is accidentally made permissive.
permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@9c73e2f62269c4b1d0240bd5dd1b81de08099bb6 # 1.88
        with:
          toolchain: 1.88.0

      - name: cargo check
        run: cargo check --all-targets --all-features --locked

  harness:
    name: harness ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable on 2026-10-15
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install uv (for uvx lizard)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1

      - name: Install supported cargo tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2 on 2026-10-15
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
          fallback: none

      - name: Check dependency sources and bans
        run: cargo deny --locked check sources bans

      # cargo-modules is not in install-action's reviewed tool manifest. Install
      # the exact previously passing release without passing github.token to the
      # action's cargo-binstall fallback.
      - name: Install cargo-modules
        run: cargo install cargo-modules --version 0.27.0 --locked

      - name: make ci
        run: make ci
