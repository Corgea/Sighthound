name: CI

on:
  push:
    branches: [main]
  pull_request:

# Validation jobs do not need to modify repository contents. Keep the token
# read-only even if the repository default is accidentally made permissive.
permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@9c73e2f62269c4b1d0240bd5dd1b81de08099bb6 # 1.88
        with:
          toolchain: 1.88.0

      - name: cargo check
        run: cargo check --all-targets --all-features --locked

  harness:
    name: harness ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable on 2026-10-15
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install uv (for uvx lizard)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.13.1

      - name: Install supported cargo tools
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2 on 2026-10-15
        with:
          tool: cargo-audit@0.22.2,cargo-llvm-cov@0.9.1
          fallback: none

      # cargo-modules is not in install-action's reviewed tool manifest. Install
      # the exact previously passing release without passing github.token to the
      # action's cargo-binstall fallback.
      - name: Install cargo-modules
        run: cargo install cargo-modules --version 0.27.0 --locked

      - name: make ci
        run: make ci
