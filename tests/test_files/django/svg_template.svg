<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
    <!-- SVG injection vulnerability - should trigger django_svg_injection -->
    <rect x="10" y="10" width="100" height="100" fill="{{ user_color }}"/>
    
    <!-- SVG with script injection -->
    <script>{{ user_script }}</script>
    
    <!-- SVG with embedded content -->
    <text x="50" y="50">{{ user_input }}</text>
    
    <!-- SVG with dangerous attributes -->
    <circle cx="50" cy="50" r="40" onload="{{ request.GET.callback }}"/>
</svg> 